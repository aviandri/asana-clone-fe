name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: asana-clone-fe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check nginx config renders and parses
        run: |
          docker run --rm --add-host be:127.0.0.1 asana-clone-fe:ci \
            sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
